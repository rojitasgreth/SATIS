<div class="scroll-container bg-white" style="width: 600px;">
  <div style="display: flex; justify-content: flex-end;">
    <button mat-icon-button (click)="cerrar('cierre')" [tabIndex]="1" class="text-black font-bold">
      X
    </button>
  </div>

  <p class="flex justify-center pb-6 text-cyan-700 text-xl font-semibold">Agregar nuevo
    cliente</p>

  <div class="flex justify-center items-center h-full mt-50">
    <form [formGroup]="customerForm" class="form-grid">
      <div class="flex flex-col mb-4" style="width: 350px;">
        <label class="mb-1">RIF:</label>
        <div class="flex items-center">
          <select formControlName="RIFL"
            class="h-12 w-10 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2">
            <option value="J">J</option>
            <option value="G">G</option>
            <option value="V">V</option>
            <option value="E">E</option>
          </select>
          <input matInput type="text" formControlName="RIF" placeholder="170333337" maxlength="9" minlength="9"
            class="h-12 w-[262px] ml-3 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-4"
            >
        </div>
        <mat-error *ngIf="customerForm.get('RIF')?.touched && customerForm.get('RIF')?.value.length != 9" class="text-red-500">RIF inválido.
        </mat-error>
        <mat-error *ngIf="customerForm.get('RIF')?.touched && customerForm.get('RIF')?.hasError('required')" class="text-red-500">
          El RIF es requerido.
        </mat-error>
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Teléfono:</label>
        <input matInput type="tel" formControlName="telefono" placeholder="04120000000" maxlength="11"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-4">
        <mat-error *ngIf="customerForm.get('telefono')?.touched && customerForm.get('telefono')?.hasError('required')" class="text-red-500">
          El teléfono es requerido.
        </mat-error>
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Cliente:</label>
        <input matInput type="text" formControlName="cliente" placeholder="Nombre ejemplo C.A"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-4">
        <mat-error *ngIf="customerForm.get('cliente')?.touched && customerForm.get('cliente')?.hasError('required')" class="text-red-500">
          El nombre del cliente es requerido.
        </mat-error>
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Correo electrónico:</label>
        <input matInput type="email" formControlName="email" placeholder="ejemplo@ejemplo.com"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-4">
        <mat-error *ngIf="customerForm.get('email')?.touched && customerForm.get('email')?.hasError('required')" class="text-red-500">
          El correo electrónico es requerido.
        </mat-error>
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Estado:</label>
        <select formControlName="estado"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2">
          <option value="AMAZONAS">AMAZONAS</option>
            <option value="ANZOATEGUI">ANZOATEGUI</option>
            <option value="APURE">APURE</option>
            <option value="ARAGUA">ARAGUA</option>
            <option value="BARINAS">BARINAS</option>
            <option value="BOLIVAR">BOLIVAR</option>
            <option value="CARABOBO">CARABOBO</option>
            <option value="COJEDES">COJEDES</option>
            <option value="DELTA AMACURO">DELTA AMACURO</option>
            <option value="DISTRITO CAPITAL">DISTRITO CAPITAL</option>
            <option value="FALCON">FALCON</option>
            <option value="GUARICO">GUARICO</option>
            <option value="LA GUAIRA">LA GUAIRA</option>
            <option value="LARA">LARA</option>
            <option value="MERIDA">MERIDA</option>
            <option value="MIRANDA">MIRANDA</option>
            <option value="MONAGAS">MONAGAS</option>
            <option value="NUEVA ESPARTA">NUEVA ESPARTA</option>
            <option value="PORTUGUESA">PORTUGUESA</option>
            <option value="SUCRE">SUCRE</option>
            <option value="TACHIRA">TACHIRA</option>
            <option value="TRUJILLO">TRUJILLO</option>
            <option value="YARACUY">YARACUY</option>
            <option value="ZULIA">ZULIA</option>
        </select>
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Calle o Avenida:</label>
        <input matInput type="text" formControlName="calle" placeholder="Calle o Avenida" maxlength="80"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-6">
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Edificio o Local:</label>
        <input matInput type="text" formControlName="edificio" placeholder="Edificio/local" maxlength="80"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-6">
      </div>

      <div class="flex flex-col mb-10 w-80">
        <button type="button" class="bg-cyan-700 text-white rounded-md text-lg" (click)="agregarCliente()">
          Agregar cliente
        </button>
      </div>
    </form>
  </div>
</div>
<style>
  .scroll-container {
    max-height: 700px;
    /* Establece la altura máxima */
    overflow-y: auto;
    /* Activa el desplazamiento vertical si el contenido excede la altura máxima */
    scroll-padding: 10%;
    /* Establece el relleno del área de desplazamiento */
    padding: 20px;
    /* Añade espacio dentro del contenedor */

  }

  .responsive-container {
    width: 100%;
    max-width: 1500px;
    /* o el ancho máximo deseado */
    min-width: 300px;
    margin: 0 auto;
    padding: 0 20px;
    /* Espacio a los lados del contenedor */
  }
</style>
