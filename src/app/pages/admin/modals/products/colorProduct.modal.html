<div class="scroll-auto" style="width: 600px; max-height: 700px">
  <div class="bg-white">
  <div style="display: flex; justify-content: flex-end;" class="p-4">
    <button mat-icon-button (click)="cerrar('cierre')" [tabIndex]="1" class="text-black font-bold">
      X
    </button>
  </div>

  <p class="flex justify-center text-xl text-cyan-700 font-semibold">Agregar nuevo color <mat-icon class="mt-1 ml-2 cursor-pointer" (click)="createColor()" matTooltip="Nuevo producto">add_circle</mat-icon></p>

  <div class="flex justify-center items-center h-full" [formGroup]="coloresForm">
    <form formArrayName="colores" class="form-grid">
      <ng-container *ngFor="let color of colores.controls; let i = index">
        <hr class="h-px bg-cyan-700 border-0 mt-8">
        <div [formGroupName]="i" class="mt-8">
      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Código de producto:</label>
        <input type="text" [formControlName]="'cod_producto'" maxlength="30"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-2 w-full text-gray-600" readonly>
        <!-- <p class="text-red-500"
          *ngIf="coloresForm.get('cod_producto')?.hasError('required') && coloresForm.get('cod_producto')?.touched">
          Campo requerido</p> -->
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Código de color:</label>
        <input type="number" [formControlName]="'codigo_color'"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-2 w-full">
        <!-- <p class="text-red-500"
          *ngIf="coloresForm.get('codigo_color')?.hasError('required') && coloresForm.get('codigo_color')?.touched">
          Campo requerido</p> -->
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Descripción del color:</label>
        <input type="text" [formControlName]="'descripcion_color'" maxlength="30"
          class="h-12 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 pl-2 w-full">
        <!-- <p class="text-red-500"
          *ngIf="coloresForm.get('descripcion_color')?.hasError('required') && coloresForm.get('descripcion_color')?.touched">
          Campo requerido</p> -->
      </div>

      <div class="flex flex-col mb-4 w-80">
        <label class="mb-1">Género:</label>
        <select [formControlName]="'genero'" class="h-12 pl-2 pr-3 w-full bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2">
          <option value="H">Hembra</option>
          <option value="V">Varón</option>
        </select>
        <!-- <p class="text-red-500"
          *ngIf="coloresForm.get('genero')?.hasError('required') && coloresForm.get('genero')?.touched">
          Campo requerido</p> -->
      </div>
      </div>
    </ng-container>

      <div class="flex mb-10 w-80">
        <button type="button" class="bg-cyan-700 text-white rounded-md text-lg w-full" (click)="agregarColor()">
          Finalizar y guardar
        </button>
        <mat-icon class="mt-1 ml-2 cursor-pointer text-cyan-700" (click)="createColor()" matTooltip="Nuevo producto">add_circle</mat-icon>
      </div>

    </form>
  </div>
</div>
</div>
