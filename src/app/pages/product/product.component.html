<app-menu></app-menu>
<div class="container pt-10 px-4 md:px-10 lg:px-36 grid grid-cols-1 lg:grid-cols-2 gap-4">
  <!-- Primera columna -->
  <div class="w-full">
    <p class="text-2xl lg:text-4xl text-cyan-700 font-semibold">{{ producto?.descripcion }}</p>
    <p class="text-lg lg:text-xl font-semibold mt-2 lg:mt-0">{{ producto?.detalle }}</p>
    <p class="mt-10 lg:mt-20 text-xl lg:text-2xl">Precio unitario: {{ producto?.precio }} $</p>
    <p class="mt-10 lg:mt-20 text-xl lg:text-2xl">Cantidad de piezas por empaque: {{ producto?.cantidad_piezas }}</p>

    <!-- Selección de género -->
    <div class="flex flex-wrap items-center mt-5 lg:mt-5">
      <p class="text-lg lg:text-2xl mr-4">Seleccionar género:</p>
      <div class="flex items-center space-x-4 align-middle">
        <label for="hembra" class="flex items-center space-x-2">
          <input type="radio" id="hembra" name="genero" value="hembra" (click)="consultarColores(producto?.cod_producto, 'H')" class="ml-2 align-middle">
          <span class="text-lg lg:text-2xl">Hembra</span>
        </label>
        <label for="varon" class="flex items-center space-x-2">
          <input type="radio" id="varon" name="genero" value="varon" (click)="consultarColores(producto?.cod_producto, 'V')" class="align-middle">
          <span class="text-lg lg:text-2xl">Varón</span>
        </label>
      </div>
    </div>

    <!-- Selección de colores -->
    <div class="flex flex-wrap items-center mt-5">
      <p class="text-lg lg:text-2xl mr-4">Seleccionar colores:</p>
      <select name="colores" id="colores" class="h-10 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2" style="max-width: 300px; min-width: 300px;" (change)="nuevoColor($event)">
        <option></option>
        <option *ngFor="let option of listaColores" [value]="option.value">{{ option.label }}</option>
      </select>
    </div>

    <!-- Colores seleccionados -->
    <div *ngIf="coloresSeleccionados.length != 0" class="text-lg lg:text-2xl mt-5">
      <div *ngFor="let item of coloresMostrar" class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5" />
          </svg>
          <p>{{ item.color.label }}</p>
        </div>
        <input #cantidadEmpaquesInput type="number" placeholder="10" (input)="agregarCantidad(item.color.value, cantidadEmpaquesInput.value, item.genero)" class="w-20 h-10 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 ml-2 cursor-pointer" (click)="eliminarColor(item.color.value, item.cod_producto)">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </div>
    </div>

    <!-- Botón guardar -->
    <div class="w-full flex justify-center items-center mt-10">
      <button class="bg-cyan-700 rounded-lg text-white text-xl lg:text-2xl w-full lg:w-80 h-12 flex items-center justify-center" (click)="continuar()">
        <span>Guardar y continuar </span>
        <span class="ml-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
          </svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Segunda columna -->
  <div class="w-full flex flex-col items-center">
    <div class="w-full flex justify-center items-center">
      <button class="bg-cyan-700 rounded-lg text-white text-xl lg:text-3xl w-full lg:w-80 h-12 flex items-center justify-center" (click)="finalizarOrden()">
        <span>Finalizar orden</span>
        <span class="ml-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </span>
      </button>
    </div>
    <div class="carousel mt-5">
      <div class="carousel-item" *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide">
        <img [src]="slide.src" alt="{{ slide.title }}" class="rounded-md mx-auto sm:max-h-max lg:max-h-[700px]"  >
      </div>
      <a class="carousel-control-prev" (click)="prevSlide()">&#10094;</a>
      <a class="carousel-control-next" (click)="nextSlide()">&#10095;</a>
    </div>
  </div>
</div>


<style>
  .carousel {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: auto;
    overflow: hidden;
    margin-top: 20px;
  }

  .carousel-item {
    display: none;
  }

  .carousel-item.active {
    display: block;
  }

  .carousel-control-prev,
  .carousel-control-next {
    position: absolute;
    top: 50%;
    width: auto;
    padding: 16px;
    color: rgb(0, 151, 167);
    font-weight: bold;
    cursor: pointer;
  }

  .carousel-control-prev {
    left: 0;
  }

  .carousel-control-next {
    right: 0;
  }

  .carousel-indicators {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
  }

  .carousel-indicators span {
    display: block;
    width: 10px;
    height: 10px;
    background-color: lightgray;
    border-radius: 50%;
    cursor: pointer;
  }

  .carousel-indicators span.active {
    background-color: rgb(0, 151, 167);
  }
</style>
