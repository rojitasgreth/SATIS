<app-menu></app-menu>
<div class="bg-white min-h-screen flex flex-col">
  <div class="container flex flex-col md:flex-row justify-between items-center px-5 md:px-20 py-5">
    <button
      class="bg-cyan-700 p-3 text-white text-lg rounded-2xl flex items-center h-10 md:ml-80 mt-5 md:mt-0"
      style="width: max-content;"
      (click)="visualizarDatosCliente()">
      Datos del cliente
    </button>
    <button
      class="bg-green-700 p-3 text-white text-lg rounded-2xl flex items-center h-10 mt-5 md:mt-0 md:ml-10"
      style="width: max-content;"
      (click)="editar()">
      Editar producto
    </button>
  </div>

  <div class="container text-center md:text-left px-5 md:pl-40 md:pt-10">
    <p class="text-2xl md:text-4xl text-cyan-700 font-semibold">Datos de la orden:</p>
  </div>

  <div class="container mx-auto px-5 md:px-40 py-5">
    <div class="bg-white shadow-xl p-4 flex flex-col md:flex-row items-center">
      <img
        [src]="baseUrl + producto.img"
        alt="Imagen del producto"
        class="w-32 md:w-40 rounded-md mb-4 md:mb-0">

      <table class="border-2 text-center md:ml-5">
        <tr class="border-2">
          <td colspan="3">
            <p class="text-lg font-semibold">{{ producto.descripcion_producto }}</p>
          </td>
        </tr>
        <tr class="border-2">
          <td class="border-2 px-3">
            <p class="text-black-600">Unidades: {{ producto.cantidad_piezas }}</p>
          </td>
          <td colspan="2" class="border-2 px-3">
            <p class="text-black-600">Precio: {{ producto.precio }} $</p>
          </td>
        </tr>
        <tr class="border-2">
          <td class="border-2 px-3">
            <p class="text-black-600">Género: {{producto.genero}}</p>
          </td>
          <td class="border-2 px-3">
            <p class="text-black-600">Color:</p>
            <select
              name="colores"
              id="colores"
              class="h-10 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2 w-full"
              [(ngModel)]="colorSeleccionado">
              <option value="{{colorInicial.value}}">{{colorInicial.label}}</option>
              <option *ngFor="let option of listaColores" [ngValue]="option">
                {{option.label}}
              </option>
            </select>
          </td>
          <td class="border-2 px-3">
            <p class="text-black-600">Cant:</p>
            <input
              type="number"
              class="w-full md:w-20 h-10 bg-white border-slate-300 hover:border-cyan-700 rounded-md border-2"
              [(ngModel)]="cantidad">
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
